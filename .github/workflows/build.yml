name: Build & Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ── 从 tag 注入版本号到三处元数据 ────────────────────────
      #     tag v0.3.0 → .pro: 0.3.0.0 / tauri: 0.3.0 / nsi: 0.3.0.0
      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v3 = "${{ github.ref_name }}" -replace '^v',''
          $v4 = "$v3.0"
          Write-Host "Injecting version: $v3 (3-seg) / $v4 (4-seg)"

          $pro = 'KnotHubCore\src\KnotHubCore\KnotHubCore.pro'
          (Get-Content $pro) -replace 'VERSION = .*', "VERSION = $v4" | Set-Content $pro -Encoding utf8

          $tauri = 'KnotHubDash\knot-hub-dash\src-tauri\tauri.conf.json'
          (Get-Content $tauri) -replace '"version":\s*"[^"]*"', "`"version`": `"$v3`"" | Set-Content $tauri -Encoding utf8

          $nsi = 'scripts\nsis\KnotHub.nsi'
          (Get-Content $nsi -Encoding Default) -replace '!define PRODUCT_VERSION\s+".*"', "!define PRODUCT_VERSION `"$v4`"" | Set-Content $nsi -Encoding Default

          Write-Host 'Version injected successfully.'

      # ── MSVC 编译器 + Qt 5.15.2（不用 MinGW，零冲突）─────────
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch:   'win64_msvc2019_64'
          cache:  true

      # ── KnotHubCore（MSVC + 动态 Qt）────────────────────────
      - name: Build KnotHubCore
        run: |
          cd KnotHubCore\src\KnotHubCore
          qmake "CONFIG+=release" KnotHubCore.pro
          nmake

      # windeployqt 收集 Qt DLLs 到 staging
      - name: Stage Core & deploy Qt DLLs
        run: |
          New-Item -ItemType Directory -Force -Path scripts\staging
          Copy-Item KnotHubCore\src\KnotHubCore\release\KnotHubCore.exe scripts\staging\
          windeployqt --release --no-translations scripts\staging\KnotHubCore.exe

      # ── Node.js + Rust (Tauri 依赖) ──────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('KnotHubDash/knot-hub-dash/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'KnotHubDash/knot-hub-dash/src-tauri'

      # ── KnotHubDash ──────────────────────────────────────────
      - name: Build KnotHubDash
        run: |
          cd KnotHubDash\knot-hub-dash
          npm ci
          npx tauri build

      # ── 打包 NSIS ────────────────────────────────────────────
      - name: Stage Dash & Package NSIS
        run: |
          Copy-Item KnotHubDash\knot-hub-dash\src-tauri\target\release\knot-hub-dash.exe scripts\staging\
          New-Item -ItemType Directory -Force -Path scripts\bin
          makensis scripts\nsis\KnotHub.nsi

      # ── 上传产物 ─────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: KnotHub-${{ github.ref_name }}-Setup
          path: scripts/bin/KnotHub-*-Setup.exe

      # ── 创建 Release 草稿 ────────────────────────────────────
      - name: Create Release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: scripts/bin/KnotHub-*-Setup.exe
          body_path: release-notes/RELEASE_NOTES_${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
