name: Build & Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: 构建 Core + Dash，保存缓存（NSIS 失败不影响）
  # ═══════════════════════════════════════════════════════════════
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ── 从 tag 注入版本号 ────────────────────────────────────
      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v3 = "${{ github.ref_name }}" -replace '^v',''
          $v4 = "$v3.0"
          Write-Host "Injecting version: $v3 / $v4"

          $pro = 'KnotHubCore\src\KnotHubCore\KnotHubCore.pro'
          (Get-Content $pro) -replace 'VERSION = .*', "VERSION = $v4" | Set-Content $pro -Encoding utf8

          $tauri = 'KnotHubDash\knot-hub-dash\src-tauri\tauri.conf.json'
          (Get-Content $tauri) -replace '"version":\s*"[^"]*"', "`"version`": `"$v3`"" | Set-Content $tauri -Encoding utf8

          $nsi = 'scripts\nsis\KnotHub.nsi'
          (Get-Content $nsi -Encoding Default) -replace '!define PRODUCT_VERSION\s+".*"', "!define PRODUCT_VERSION `"$v4`"" | Set-Content $nsi -Encoding Default

      # ── MSVC + Qt 5.15.2 ─────────────────────────────────────
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch:   'win64_msvc2019_64'
          cache:  true

      # ── KnotHubCore ──────────────────────────────────────────
      - name: Build KnotHubCore
        run: |
          cd KnotHubCore\src\KnotHubCore
          qmake "CONFIG+=release" KnotHubCore.pro
          nmake

      - name: Stage Core & deploy Qt DLLs
        run: |
          New-Item -ItemType Directory -Force -Path scripts\staging
          Copy-Item KnotHubCore\src\KnotHubCore\release\KnotHubCore.exe scripts\staging\
          windeployqt --release --no-translations scripts\staging\KnotHubCore.exe

      # ── 上传 Core 产物（含 Qt DLLs）──────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: core-staging
          path: scripts/staging/

      # ── Node.js + Rust ───────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('KnotHubDash/knot-hub-dash/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'KnotHubDash/knot-hub-dash/src-tauri'

      # ── KnotHubDash ──────────────────────────────────────────
      - name: Build KnotHubDash
        run: |
          cd KnotHubDash\knot-hub-dash
          npm ci
          npx tauri build

      # ── 上传 Dash 产物 ───────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: dash-exe
          path: KnotHubDash/knot-hub-dash/src-tauri/target/release/knot-hub-dash.exe

  # ═══════════════════════════════════════════════════════════════
  # Job 2: NSIS 打包 + Release（依赖 Job 1）
  # ═══════════════════════════════════════════════════════════════
  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 注入版本号（再次，因为不同 job）
      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v4 = ("${{ github.ref_name }}" -replace '^v','') + '.0'
          $nsi = 'scripts\nsis\KnotHub.nsi'
          (Get-Content $nsi -Encoding Default) -replace '!define PRODUCT_VERSION\s+".*"', "!define PRODUCT_VERSION `"$v4`"" | Set-Content $nsi -Encoding Default

      # 下载 build job 产物
      - uses: actions/download-artifact@v4
        with:
          name: core-staging
          path: scripts/staging/

      - uses: actions/download-artifact@v4
        with:
          name: dash-exe
          path: scripts/staging/

      # NSIS 打包
      - name: Install NSIS & Package
        run: |
          choco install nsis --no-progress -y
          New-Item -ItemType Directory -Force -Path scripts\bin
          $nsisDir = Resolve-Path "C:\Program Files (x86)\NSIS\*"
          $makensis = Get-ChildItem $nsisDir -Recurse -Filter makensis.exe | Select-Object -First 1
          & $makensis.FullName scripts\nsis\KnotHub.nsi

      # 上传安装包
      - uses: actions/upload-artifact@v4
        with:
          name: KnotHub-${{ github.ref_name }}-Setup
          path: scripts/bin/KnotHub-*-Setup.exe

      # 创建 Release 草稿
      - name: Create Release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: scripts/bin/KnotHub-*-Setup.exe
          body_path: release-notes/RELEASE_NOTES_${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
