<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnotHub 三栏仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fc;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #1e2a3a;
            height: 100vh;
            overflow: hidden;
        }

        /* 三栏布局容器 */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* 左侧导航栏 */
        .nav-bar {
            width: 220px;
            background: #ffffff;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            padding: 24px 0 24px 0;
            flex-shrink: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #0b5e7e;
            margin: 0 16px 32px 20px;
            padding-left: 12px;
            border-left: 3px solid #0b5e7e;
        }

        .nav-item {
            display: block;
            padding: 10px 20px;
            color: #2c3e50;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            margin: 0 8px;
            border-radius: 6px;
        }
        .nav-item:hover {
            background: #e9ecef;
        }
        .nav-item.active {
            background: #e2e6ea;
            font-weight: 500;
            color: #0b5e7e;
        }

        /* 中间主栏 */
        .main-bar {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #f5f7fc;
        }

        /* 右侧预览栏 */
        .preview-bar {
            width: 300px;
            background: #ffffff;
            border-left: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .preview-title {
            font-size: 16px;
            font-weight: 500;
            color: #1e4663;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9ecef;
            margin-bottom: 16px;
        }

        .preview-content {
            font-size: 13px;
            color: #495057;
            line-height: 1.5;
        }

        .preview-field {
            margin-bottom: 12px;
        }
        .preview-field strong {
            display: inline-block;
            width: 70px;
            color: #6c757d;
        }

        /* 公用组件样式 */
        .section {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 24px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: #1e4663;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            padding: 4px 12px;
            border-radius: 4px;
            color: #212529;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover {
            background: #e9ecef;
        }
        .btn-primary {
            background: #0b5e7e;
            border-color: #0b5e7e;
            color: white;
        }
        .monitor-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .monitor-table th, .monitor-table td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid #e9ecef;
        }
        .monitor-table th {
            color: #495057;
            font-weight: 500;
            background: #f8f9fa;
        }
        .monitor-table tbody tr {
            cursor: pointer;
            transition: background 0.1s;
        }
        .monitor-table tbody tr:hover {
            background: #f1f3f5;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            background: #d4edda;
            color: #155724;
        }
        .status-badge.warning {
            background: #fff3cd;
            color: #856404;
        }
        .status-badge.critical {
            background: #f8d7da;
            color: #721c24;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 16px;
        }
        .stat-title {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 500;
            color: #2c3e50;
        }
        hr {
            margin: 16px 0;
            border: none;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 左侧导航栏 -->
    <div class="nav-bar">
        <div class="logo">KnotHub 服务中枢</div>
        <nav>
            <div class="nav-item" data-route="home">主页</div>
            <div class="nav-item" data-route="nodes">节点列表</div>
            <div class="nav-item" data-route="interconnect">互联配方</div>
            <div class="nav-item" data-route="service">服务状态</div>
            <div class="nav-item" data-route="debug">调试</div>
            <div class="nav-item" data-route="settings">设置</div>
        </nav>
        <div style="margin-top: auto; font-size: 12px; color: #6c757d; padding: 32px 20px 20px;">
            双机热备 · 实时同步
        </div>
    </div>

    <!-- 中间主栏 -->
    <div class="main-bar" id="main-content">
        <!-- 动态页面渲染到这里 -->
    </div>

    <!-- 右侧预览栏 -->
    <div class="preview-bar" id="preview-bar">
        <div class="preview-title">预览面板</div>
        <div class="preview-content" id="preview-content">
            <p>点击中间列表中的项目，<br>此处将显示详细信息。</p>
        </div>
    </div>
</div>

<script>
    // ---------- 页面渲染函数（仅展示核心内容，可根据需求扩展）----------
    const pages = {
        home: () => `
            <div style="margin-bottom: 16px;">
                <h1 style="font-size: 22px; font-weight: 500;">主页</h1>
                <p style="color: #6c757d; margin-top: 4px;">服务总览与关键指标</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-title">服务实例</div><div class="stat-value">12</div></div>
                <div class="stat-card"><div class="stat-title">链路连接数</div><div class="stat-value">24</div></div>
                <div class="stat-card"><div class="stat-title">双机热备状态</div><div class="stat-value">主→备</div></div>
                <div class="stat-card"><div class="stat-title">下载管理</div><div class="stat-value">4.2 MB/s</div></div>
            </div>
            <div class="section">
                <div class="section-header"><div class="section-title">快速操作</div></div>
                <button class="btn btn-primary" data-action="sync">触发同步</button>
            </div>
        `,
        nodes: () => `
            <div style="margin-bottom: 16px;">
                <h1 style="font-size: 22px; font-weight: 500;">节点列表</h1>
                <p style="color: #6c757d;">服务节点管理 · 插入式结构</p>
            </div>
            <div class="section">
                <div class="section-header">
                    <div class="section-title">节点管理</div>
                    <div class="btn-group"><button class="btn btn-sm" data-action="install-plugin">安装插件</button></div>
                </div>
                <table class="monitor-table" id="node-table">
                    <thead><tr><th>节点ID</th><th>角色</th><th>状态</th><th>热备角色</th></tr></thead>
                    <tbody>
                        <tr data-node-id="node-01" data-node-type="node"><td>node-01</td><td>主控</td><td><span class="status-badge">运行中</span></td><td>主节点</td></tr>
                        <tr data-node-id="node-02" data-node-type="node"><td>node-02</td><td>工作节点</td><td><span class="status-badge">运行中</span></td><td>热备从机</td></tr>
                        <tr data-node-id="node-03" data-node-type="node"><td>node-03</td><td>备份节点</td><td><span class="status-badge warning">停止</span></td><td>待命</td></tr>
                    </tbody>
                </table>
            </div>
        `,
        interconnect: () => `
            <div style="margin-bottom: 16px;">
                <h1 style="font-size: 22px; font-weight: 500;">互联配方</h1>
                <p style="color: #6c757d;">链路管理与下载控制</p>
            </div>
            <div class="section">
                <div class="section-header">
                    <div class="section-title">互联网运行管理器 · 链路控制</div>
                    <div class="btn-group"><button class="btn btn-sm" data-action="new-link">新建链路</button></div>
                </div>
                <table class="monitor-table" id="link-table">
                    <thead><tr><th>链路名称</th><th>状态</th><th>实时速率</th></tr></thead>
                    <tbody>
                        <tr data-link-id="main-link" data-link-type="link"><td>主骨干链路</td><td><span class="status-badge">已连接</span></td><td>12.4 Mbps</td></tr>
                        <tr data-link-id="backup-link" data-link-type="link"><td>备份链路-电信</td><td><span class="status-badge warning">波动</span></td><td>3.2 Mbps</td></tr>
                        <tr data-link-id="hot-link" data-link-type="link"><td>专线热备链路</td><td><span class="status-badge">待命</span></td><td>0 Mbps</td></tr>
                    </tbody>
                </table>
            </div>
        `,
        service: () => `
            <div style="margin-bottom: 16px;">
                <h1 style="font-size: 22px; font-weight: 500;">服务状态</h1>
                <p style="color: #6c757d;">端口监控与服务实例健康度</p>
            </div>
            <div class="section">
                <div class="section-header"><div class="section-title">物理端口检查</div></div>
                <table class="monitor-table" id="port-table">
                    <thead><tr><th>端口</th><th>服务</th><th>状态</th></tr></thead>
                    <tbody>
                        <tr data-port="8080"><td>8080</td><td>Web</td><td><span class="status-badge">正常</span></td></tr>
                        <tr data-port="8443"><td>8443</td><td>API</td><td><span class="status-badge">正常</span></td></tr>
                        <tr data-port="3306"><td>3306</td><td>DB</td><td><span class="status-badge warning">高延迟</span></td></tr>
                    </tbody>
                </table>
            </div>
        `,
        debug: () => `<div><h1>调试</h1><p>诊断工具与日志占位</p></div>`,
        settings: () => `<div><h1>设置</h1><p>热备配置参数占位</p></div>`
    };

    // 预览栏更新函数（根据选中项类型展示不同内容）
    function updatePreview(itemType, itemId, extraData = {}) {
        const previewDiv = document.getElementById('preview-content');
        if (!previewDiv) return;

        if (itemType === 'node') {
            // 模拟节点详情数据
            const nodeDetails = {
                'node-01': { ip: '10.2.10.101', cpu: '12%', mem: '3.2/8 GB', role: '主节点', lastSeen: '2025-03-21 14:32:05' },
                'node-02': { ip: '10.2.10.102', cpu: '34%', mem: '5.1/8 GB', role: '热备从机', lastSeen: '2025-03-21 14:32:01' },
                'node-03': { ip: '10.2.10.103', cpu: '0%', mem: 'N/A', role: '待命', lastSeen: '2025-03-21 10:15:22' }
            };
            const info = nodeDetails[itemId] || { ip: '未知', cpu: '--', mem: '--', role: '--', lastSeen: '--' };
            previewDiv.innerHTML = `
                <div class="preview-field"><strong>节点ID</strong> ${itemId}</div>
                <div class="preview-field"><strong>IP地址</strong> ${info.ip}</div>
                <div class="preview-field"><strong>角色</strong> ${info.role}</div>
                <div class="preview-field"><strong>CPU使用</strong> ${info.cpu}</div>
                <div class="preview-field"><strong>内存使用</strong> ${info.mem}</div>
                <div class="preview-field"><strong>最后心跳</strong> ${info.lastSeen}</div>
                <hr>
                <button class="btn btn-sm" data-node-action="restart" data-node-id="${itemId}">重启节点</button>
                <button class="btn btn-sm" data-node-action="failover" data-node-id="${itemId}">热备切换</button>
            `;
        } 
        else if (itemType === 'link') {
            const linkDetails = {
                'main-link': { type: '主骨干链路', rate: '12.4 Mbps', latency: '8ms', status: '已连接' },
                'backup-link': { type: '备份链路-电信', rate: '3.2 Mbps', latency: '25ms', status: '波动' },
                'hot-link': { type: '专线热备链路', rate: '0 Mbps', latency: 'N/A', status: '待命' }
            };
            const info = linkDetails[itemId] || { type: '未知', rate: '--', latency: '--', status: '--' };
            previewDiv.innerHTML = `
                <div class="preview-field"><strong>链路名称</strong> ${info.type}</div>
                <div class="preview-field"><strong>实时速率</strong> ${info.rate}</div>
                <div class="preview-field"><strong>延迟</strong> ${info.latency}</div>
                <div class="preview-field"><strong>状态</strong> ${info.status}</div>
                <hr>
                <button class="btn btn-sm" data-link-action="disconnect" data-link-id="${itemId}">断开</button>
                <button class="btn btn-sm" data-link-action="reconnect" data-link-id="${itemId}">重连</button>
            `;
        }
        else if (itemType === 'port') {
            previewDiv.innerHTML = `
                <div class="preview-field"><strong>端口</strong> ${itemId}</div>
                <div class="preview-field"><strong>详情</strong> 可在此处添加端口监控指标</div>
                <button class="btn btn-sm" data-port-action="check">重新检查</button>
            `;
        }
        else {
            previewDiv.innerHTML = `<p>点击中间列表中的项目，<br>此处将显示详细信息。</p>`;
        }

        // 重新绑定预览栏按钮事件（演示）
        document.querySelectorAll('[data-node-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const nodeId = btn.dataset.nodeId;
                alert(`[演示] 对节点 ${nodeId} 执行 ${btn.dataset.nodeAction}`);
            });
        });
        document.querySelectorAll('[data-link-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                alert(`[演示] 对链路 ${btn.dataset.linkId} 执行 ${btn.dataset.linkAction}`);
            });
        });
    }

    // 给中间主栏的表格行绑定点击事件（动态绑定）
    function bindRowClickEvents() {
        // 节点表格行
        document.querySelectorAll('#node-table tbody tr[data-node-id]').forEach(row => {
            row.removeEventListener('click', row._clickHandler);
            const handler = () => {
                const nodeId = row.getAttribute('data-node-id');
                updatePreview('node', nodeId);
            };
            row.addEventListener('click', handler);
            row._clickHandler = handler;
        });
        // 链路表格行
        document.querySelectorAll('#link-table tbody tr[data-link-id]').forEach(row => {
            row.removeEventListener('click', row._clickHandler);
            const handler = () => {
                const linkId = row.getAttribute('data-link-id');
                updatePreview('link', linkId);
            };
            row.addEventListener('click', handler);
            row._clickHandler = handler;
        });
        // 端口表格行（服务状态页面）
        document.querySelectorAll('#port-table tbody tr[data-port]').forEach(row => {
            row.removeEventListener('click', row._clickHandler);
            const handler = () => {
                const port = row.getAttribute('data-port');
                updatePreview('port', port);
            };
            row.addEventListener('click', handler);
            row._clickHandler = handler;
        });
    }

    // 路由渲染
    let currentRoute = 'home';
    function render(route) {
        const mainDiv = document.getElementById('main-content');
        if (pages[route]) {
            mainDiv.innerHTML = pages[route]();
            currentRoute = route;
            // 渲染完成后重新绑定行点击事件
            bindRowClickEvents();
            // 绑定页面内的按钮演示
            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', () => alert(`[演示] 操作: ${btn.dataset.action}`));
            });
            // 可选：切换页面时清空预览栏
            updatePreview(null, null);
        } else {
            mainDiv.innerHTML = '<div>页面不存在</div>';
        }
        // 高亮导航
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.dataset.route === route) item.classList.add('active');
            else item.classList.remove('active');
        });
    }

    // 监听hash变化
    window.addEventListener('hashchange', () => {
        let route = window.location.hash.slice(1);
        if (!route || !pages[route]) route = 'home';
        render(route);
    });

    // 侧边栏点击
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            const route = item.dataset.route;
            if (route) {
                window.location.hash = route;
                render(route);
            }
        });
    });

    // 初始加载
    if (!window.location.hash || window.location.hash === '#') {
        window.location.hash = 'home';
    } else {
        const route = window.location.hash.slice(1);
        if (pages[route]) render(route);
        else render('home');
    }
</script>
</body>
</html>
